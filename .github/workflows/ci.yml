name: CI

on:
  # Docs-only changes (the root guide files, any README) build nothing, so they
  # skip the sample builds. leak-check.yml (leak check + root-guide check)
  # still runs on them.
  push:
    branches: [main]
    paths-ignore: ["**.md", "llms.txt", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "llms.txt", "LICENSE"]

# Read-only token: these jobs only build. Least privilege per GitHub's
# Actions hardening guidance.
permissions:
  contents: read

# Builds only, nothing deploys: a newer push to the same branch cancels the
# older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One list of samples, derived from the tree: a top-level folder with a
  # package.json is a Node sample, one with a requirements.txt is a Python
  # sample (scripts/check-root-docs.mjs --list). A new sample is built and
  # type-checked without anyone editing this file.
  list-samples:
    name: List samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.list.outputs.node }}
      python: ${{ steps.list.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        run: node scripts/check-root-docs.mjs --list >> "$GITHUB_OUTPUT"

  node-samples:
    name: ${{ matrix.sample }} (Node)
    needs: list-samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.list-samples.outputs.node) }}
    defaults:
      run:
        working-directory: ./${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.sample }}/package-lock.json

      - name: Install
        # npm ci installs exactly the committed lockfile (and fails if it is
        # out of step with package.json), so CI builds what integrators get.
        run: npm ci --no-audit --no-fund

      - name: Type check
        # Prefer the sample's own typecheck script; fall back to a bare
        # `tsc --noEmit` when the sample has a tsconfig but no script. Samples
        # with neither (e.g. agent-mcp — MCP config only, no source) just
        # verify that dependencies install.
        run: |
          if npm run | grep -qE '^\s*typecheck'; then
            npm run typecheck
          elif [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "no typecheck script and no tsconfig — install-only sample"
          fi

      - name: Lint (best-effort)
        run: npx eslint . --max-warnings=0 || echo "no eslint config — skipping"
        continue-on-error: true

      - name: Build
        env:
          # CI uses placeholder env so build doesn't fail validation. Real
          # samples need test keys at runtime, not build time.
          VON_PAY_SECRET_KEY: vp_sk_test_ci_placeholder
          VON_PAY_SESSION_SECRET: ss_test_ci_placeholder
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "no build script — skipping"
          fi

  python-samples:
    name: ${{ matrix.sample }} (Python)
    needs: list-samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.list-samples.outputs.python) }}
    defaults:
      run:
        working-directory: ./${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.sample }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile check
        # Byte-compile every .py in the sample. This catches syntax errors
        # without executing import-time side effects (env-var reads, sys.exit
        # on a missing key) — no runtime secrets needed.
        run: python -m py_compile *.py
